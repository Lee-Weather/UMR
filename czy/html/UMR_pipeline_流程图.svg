<svg xmlns="http://www.w3.org/2000/svg" id="umr-pipeline-chart" viewBox="0 0 1120 1450" role="img" aria-labelledby="umr-flow-title umr-flow-desc">
<title id="umr-flow-title">UMR 本地管线完整流程图</title><desc id="umr-flow-desc">人体和机器人模板经过表面采样、数据集构建及自编码器训练得到对应 slots；已有兼容 slots 可直接复用。人体运动和绑定后的 slots 进入逐帧优化，得到机器人轨迹，经 LQR 滤波保存为 NPZ 并可视化。</desc>
<defs><marker id="umr-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#668b77"/></marker></defs>
<style>#umr-pipeline-chart text{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;text-anchor:middle;fill:#233e30}#umr-pipeline-chart .node rect{fill:#fff;stroke:#b5cbb9;stroke-width:1.5}#umr-pipeline-chart .node-title{font-size:19px;font-weight:700}#umr-pipeline-chart .node-sub{font-size:13px;fill:#607667}#umr-pipeline-chart .primary rect{fill:#215d49;stroke:#215d49}#umr-pipeline-chart .primary .node-title{fill:#fff}#umr-pipeline-chart .primary .node-sub{fill:#d4e8d8}#umr-pipeline-chart .artifact rect{fill:#e3efdf;stroke:#9abb9c}#umr-pipeline-chart .existing rect{fill:#f8f4e9;stroke:#cdb88a;stroke-dasharray:5 4}#umr-pipeline-chart .edge{fill:none;stroke:#668b77;stroke-width:2}#umr-pipeline-chart .reuse{stroke-dasharray:7 5}#umr-pipeline-chart .zone{fill:#f1f6ef;stroke:#d5e3d3}#umr-pipeline-chart .zone-b{fill:#edf4f1;stroke:#d5e3d3}#umr-pipeline-chart .zone-title{text-anchor:start;font-size:15px;letter-spacing:1px;font-weight:700;fill:#3c7554}#umr-pipeline-chart .label{font-size:13px;fill:#607667}#umr-pipeline-chart .small{font-size:12px;fill:#617365}
</style>
<rect width="1120" height="1450" rx="16" fill="#fff"/>
<rect class="zone" x="24" y="22" width="758" height="600" rx="16"/>
<text class="zone-title" x="48" y="56">A / 模板准备与对应关系学习</text>
<rect class="zone-b" x="24" y="644" width="1072" height="566" rx="16"/>
<text class="zone-title" x="48" y="677">B / 每段动作的重定向</text>
<g class="node "><rect x="60" y="90" width="300" height="82" rx="12"/><text x="210.0" y="122" class="node-title">人体参考模板</text><text x="210.0" y="147" class="node-sub">SMPL-X · gender / betas</text></g><g class="node "><rect x="440" y="90" width="300" height="82" rx="12"/><text x="590.0" y="122" class="node-title">机器人参考模板</text><text x="590.0" y="147" class="node-sub">MJCF · T-pose · 中心与坐标系</text></g><g class="node "><rect x="810" y="90" width="270" height="82" rx="12"/><text x="945.0" y="122" class="node-title">人体运动序列</text><text x="945.0" y="147" class="node-sub">逐帧姿态 · 位移 · 帧率</text></g><path class="edge" d="M210 172 V210 H400 V238" marker-end="url(#umr-arrow)"/><path class="edge" d="M590 172 V210 H400" marker-end="url(#umr-arrow)"/><g class="node primary"><rect x="165" y="240" width="470" height="82" rx="12"/><text x="400.0" y="272" class="node-title">01 · BUILD：表面采样</text><text x="400.0" y="297" class="node-sub">参考姿态对齐 → 外表面采样 · 默认 4096 点</text></g><path class="edge" d="M400 322 V350 H225 V378" marker-end="url(#umr-arrow)"/><g class="node artifact"><rect x="60" y="380" width="330" height="82" rx="12"/><text x="225.0" y="412" class="node-title">对应关系数据集</text><text x="225.0" y="437" class="node-sub">data/correspondence_*.npz</text></g><path class="edge" d="M390 421 H438" marker-end="url(#umr-arrow)"/><g class="node primary"><rect x="440" y="380" width="300" height="82" rx="12"/><text x="590.0" y="412" class="node-title">02 · TRAIN：学习对应</text><text x="590.0" y="437" class="node-sub">共享模板 + 形状残差 · 默认 500 epochs</text></g><path class="edge" d="M590 462 V518" marker-end="url(#umr-arrow)"/><g class="node artifact"><rect x="440" y="520" width="300" height="82" rx="12"/><text x="590.0" y="552" class="node-title">对应 slots</text><text x="590.0" y="577" class="node-sub">统一索引 · slots NPZ + checkpoint</text></g><g class="node existing"><rect x="60" y="520" width="300" height="82" rx="12"/><text x="210.0" y="552" class="node-title">已有兼容 slots</text><text x="210.0" y="577" class="node-sub">复用缓存，跳过采样与训练</text></g><path class="edge reuse" d="M360 561 H438" marker-end="url(#umr-arrow)"/><path class="edge" d="M590 602 V706" marker-end="url(#umr-arrow)"/><g class="node "><rect x="440" y="708" width="300" height="82" rx="12"/><text x="590.0" y="740" class="node-title">表面绑定与体型适配</text><text x="590.0" y="765" class="node-sub">绑定人体 / 机器人表面 · 可跨 beta 复用</text></g><path class="edge" d="M945 172 V706" marker-end="url(#umr-arrow)"/><g class="node "><rect x="810" y="708" width="270" height="82" rx="12"/><text x="945.0" y="740" class="node-title">人体表面运动与缩放</text><text x="945.0" y="765" class="node-sub">目标点位 / 方向 · 身高比例适配</text></g><path class="edge" d="M740 749 H808" marker-end="url(#umr-arrow)"/><path class="edge" d="M590 790 V832 H600 V858" marker-end="url(#umr-arrow)"/><path class="edge" d="M945 790 V900 H802" marker-end="url(#umr-arrow)"/><g class="node primary"><rect x="400" y="860" width="400" height="82" rx="12"/><text x="600.0" y="892" class="node-title">03 · RETARGET：逐帧优化</text><text x="600.0" y="917" class="node-sub">表面匹配 + 接触 + 平滑 + 启用的约束</text></g><path class="edge" d="M400 901 H310 V1006 H398" marker-end="url(#umr-arrow)"/><g class="node "><rect x="400" y="966" width="400" height="82" rx="12"/><text x="600.0" y="998" class="node-title">更新机器人姿态 qpos</text><text x="600.0" y="1023" class="node-sub">以上一帧初始化 · 连续求解整个序列</text></g><path class="edge reuse" d="M800 1007 H853 V956 H704 V944" marker-end="url(#umr-arrow)"/><text class="label" x="904" y="991">下一帧</text><path class="edge" d="M600 1048 V1096" marker-end="url(#umr-arrow)"/><g class="node "><rect x="400" y="1098" width="400" height="82" rx="12"/><text x="600.0" y="1130" class="node-title">轨迹后处理</text><text x="600.0" y="1155" class="node-sub">当前配置：LQR 轨迹滤波</text></g><path class="edge" d="M600 1180 V1256" marker-end="url(#umr-arrow)"/><g class="node artifact"><rect x="400" y="1258" width="400" height="82" rx="12"/><text x="600.0" y="1290" class="node-title">保存机器人动作</text><text x="600.0" y="1315" class="node-sub">NPZ：qpos · fps · 机器人 / 源数据元信息</text></g><path class="edge" d="M800 1299 H838" marker-end="url(#umr-arrow)"/><g class="node "><rect x="840" y="1258" width="240" height="82" rx="12"/><text x="960.0" y="1290" class="node-title">查看与分享</text><text x="960.0" y="1315" class="node-sub">MuJoCo 播放 · 可选 MP4</text></g><text class="small" x="548" y="1390">实线：主要数据流　　虚线：兼容缓存复用 / 帧间循环　　深绿色：核心执行阶段</text><text class="small" x="548" y="1418">本图依据当前仓库实现；具体损失项、约束和后处理由配置决定。</text></svg>